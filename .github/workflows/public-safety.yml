name: Public content safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public content and history
        run: python scripts/check-public-content.py --history
