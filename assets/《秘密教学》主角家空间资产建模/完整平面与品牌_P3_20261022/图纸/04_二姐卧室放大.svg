<text x="1430.00" y="207.00" font-size="16" font-weight="400" text-anchor="start">面向入口墙看：</text>
<text x="1430.00" y="236.00" font-size="16" font-weight="400" text-anchor="start">左侧床 → 抽屉柜 → 书桌</text>
