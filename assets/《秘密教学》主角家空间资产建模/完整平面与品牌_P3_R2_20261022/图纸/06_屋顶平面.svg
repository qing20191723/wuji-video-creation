<text x="65.00" y="65.00" font-size="32" font-weight="700" text-anchor="start">06 / 屋顶平面与出屋面楼梯</text>
<text x="65.00" y="105.00" font-size="17" font-weight="400" text-anchor="start">屋顶小房子由公共楼梯落位；非完整第三层住宅</text>
<path d="M65 126H1735" stroke="#bccbc1"/>
<text x="65.00" y="1190.00" font-size="17" font-weight="400" text-anchor="start">P3-R2 · 2026-10-22    先家具 → 内部范围 → 楼层整合 → 外轮廓    |    影视空间设计稿 · 待验收</text>
<text x="1430.00" y="165.00" font-size="23" font-weight="700" text-anchor="start">图纸说明</text>
<text x="1430.00" y="207.00" font-size="16" font-weight="400" text-anchor="start">深灰体量：屋顶楼梯间</text>
<text x="1430.00" y="236.00" font-size="16" font-weight="400" text-anchor="start">入口接公共上平台</text>
<text x="1430.00" y="265.00" font-size="16" font-weight="400" text-anchor="start">原直梯继续只连接1—2层</text>
<text x="1430.00" y="294.00" font-size="16" font-weight="400" text-anchor="start">新增双跑梯连接2—屋顶</text>
<text x="1430.00" y="323.00" font-size="16" font-weight="400" text-anchor="start">屋面其余部分为检修通路</text>
<text x="1430.00" y="352.00" font-size="16" font-weight="400" text-anchor="start">支承 / 防水需后续工程校核</text>
