<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240"><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#243b40}</style><rect width="1800" height="1240" fill="#f8f7f2"/>
<text x="65.00" y="65.00" font-size="32" font-weight="700" text-anchor="start">09 / 1楼固定品牌布置</text>
<text x="65.00" y="105.00" font-size="17" font-weight="400" text-anchor="start">N 正向完整版 / M 整组镜像 / 小型图标附着物件；所有域名随完整母版固定</text>
<path d="M65 126H1735" stroke="#bccbc1"/>
<text x="65.00" y="1190.00" font-size="17" font-weight="400" text-anchor="start">P3-R2 · 2026-10-22    先家具 → 内部范围 → 楼层整合 → 外轮廓    |    影视空间设计稿 · 待验收</text>
<text x="1430.00" y="165.00" font-size="23" font-weight="700" text-anchor="start">图纸说明</text>
<text x="1430.00" y="207.00" font-size="16" font-weight="400" text-anchor="start">主元素：每空间少量设置</text>
<text x="1430.00" y="236.00" font-size="16" font-weight="400" text-anchor="start">不同载体分担正反机位</text>
<text x="1430.00" y="265.00" font-size="16" font-weight="400" text-anchor="start">不要求每镜出现Logo</text>
<text x="1430.00" y="294.00" font-size="16" font-weight="400" text-anchor="start">不移动家具换取露出</text>
<text x="1430.00" y="323.00" font-size="16" font-weight="400" text-anchor="start">N与M都包含 hgdju.com</text>
<text x="1430.00" y="352.00" font-size="16" font-weight="400" text-anchor="start">房间门牌不做镜像</text>
<text x="1430.00" y="381.00" font-size="16" font-weight="400" text-anchor="start">镜面反射由后续渲染验证</text>
