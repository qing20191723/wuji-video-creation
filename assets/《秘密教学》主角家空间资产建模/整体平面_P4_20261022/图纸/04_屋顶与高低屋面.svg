<text x="65.00" y="65.00" font-size="32" font-weight="700" text-anchor="start">04 / 屋顶平面 · 高低屋面与出屋面小房子</text>
<text x="65.00" y="105.00" font-size="17" font-weight="400" text-anchor="start">深灰小房子是楼梯出口；不增设完整第三层住宅</text>
<path d="M65 126H1735" stroke="#bccbc1"/>
<text x="65.00" y="1190.00" font-size="17" font-weight="400" text-anchor="start">P4 · 2026-10-22    先家具 → 内部范围 → 楼层整合 → 外轮廓    |    影视空间设计稿 · 待验收</text>
