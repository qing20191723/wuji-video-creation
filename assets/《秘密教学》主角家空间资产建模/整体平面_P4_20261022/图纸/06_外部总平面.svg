<text x="65.00" y="65.00" font-size="32" font-weight="700" text-anchor="start">06 / 外部总平面 · 入户、停车与庭院</text>
<text x="65.00" y="105.00" font-size="17" font-weight="400" text-anchor="start">地块32.00×32.20m为本方案向外推导结果，不是室内限制条件</text>
<path d="M65 126H1735" stroke="#bccbc1"/>
<text x="65.00" y="1190.00" font-size="17" font-weight="400" text-anchor="start">P4 · 2026-10-22    先家具 → 内部范围 → 楼层整合 → 外轮廓    |    影视空间设计稿 · 待验收</text>
<text x="1430.00" y="165.00" font-size="23" font-weight="700" text-anchor="start">图纸说明</text>
<text x="1430.00" y="207.00" font-size="16" font-weight="400" text-anchor="start">二楼公共庭院位于右前侧</text>
<text x="1430.00" y="236.00" font-size="16" font-weight="400" text-anchor="start">下方檐下区接一楼前庭</text>
<text x="1430.00" y="265.00" font-size="16" font-weight="400" text-anchor="start">南侧为临街入口</text>
<text x="1430.00" y="294.00" font-size="16" font-weight="400" text-anchor="start">停车与人行入口分开</text>
<text x="1430.00" y="323.00" font-size="16" font-weight="400" text-anchor="start">入户步道宽1.60m</text>
<text x="1430.00" y="352.00" font-size="16" font-weight="400" text-anchor="start">两侧及后方留检修通路</text>
<text x="1430.00" y="381.00" font-size="16" font-weight="400" text-anchor="start">浅石材 / 木饰面 / 深灰栏杆</text>
<text x="1430.00" y="410.00" font-size="16" font-weight="400" text-anchor="start">外部与地块均为设计提案</text>
