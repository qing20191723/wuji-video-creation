<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秘密教学 · 镜头工作台</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<header><div class="wordmark"><span class="mark">◩</span><div><strong>秘密教学</strong><small>镜头工作台</small></div></div><div class="current"><i></i> 当前模型 P4-M2 <span>· 日景预览</span></div><button id="saved-tab" class="quiet">我的镜头 <b id="saved-count">0</b></button></header>
<main><aside class="library"><div class="section-title"><span>01 / 选空间</span><span id="preset-count"></span></div><label class="search"><span>⌕</span><input id="search" placeholder="搜索空间或拍摄方向" aria-label="搜索机位"></label><nav id="rooms" aria-label="场景空间"></nav><div class="section-title shots-title"><span>预设机位</span><button id="reset" class="text-button">回到预设</button></div><select id="angle-filter" aria-label="拍摄方向分类"><option value="">全部方向</option></select><div id="presets"></div><div id="saved" hidden><div class="section-title">已保存 · 点击继续调整</div><div id="saved-list"></div></div></aside>
<section class="workspace"><div class="scene-head"><div><span class="eyebrow" id="room-label">全屋外观</span><h1 id="shot-title">正在载入模型</h1></div><select id="view-mode" aria-label="场景显示"><option value="full">完整场景</option><option value="floor2">二楼剖切总览</option><option value="floor1">一楼剖切总览</option></select></div><div class="stage" id="stage"><div id="frame"><canvas id="view" aria-label="可交互三维机位预览"></canvas><div class="grid" id="grid"></div><div class="frame-tags"><span id="ratio-tag">9:16</span><span id="live-tag">实时构图</span></div></div><div id="loading">正在读取 P4-M2 实体模型…</div><div id="load-error" hidden></div></div><div class="view-toolbar"><div class="segmented"><button data-ratio="9:16" class="active">9:16 竖屏</button><button data-ratio="16:9">16:9 横屏</button><button data-ratio="1:1">1:1</button></div><label><input type="checkbox" id="grid-toggle"> 三分线</label><label><input type="checkbox" id="flip"> 镜像检查</label></div><p class="hint">左键拖动环绕 · 右键拖动平移 · 滚轮拉近/拉远 · 按住 Shift 拖动平移</p><div id="notice" role="status">基础材质用于选角度，实际场景图在选定镜头后制作。</div></section>
<aside class="settings"><div class="section-title">02 / 微调镜头</div><label class="field">镜头名称<input id="shot-name" maxlength="80" placeholder="给这个角度起个名字"></label><label class="field">视野 <output id="fov-value">55°</output><input id="fov" type="range" min="25" max="95" step="1" value="55"></label><div class="scale-label"><span>细节更近</span><span>环境更宽</span></div><label class="field">相机高度 <output id="height-value">1.60 m</output><input id="height" type="range" min="0.3" max="3" step="0.05" value="1.6"></label><div class="section-title subtle">相机微移</div><div class="move-grid"><button data-move="left">← 左移</button><button data-move="forward">↑ 前进</button><button data-move="right">右移 →</button><button data-move="down">降低</button><button data-move="back">↓ 后退</button><button data-move="up">升高</button></div><div class="section-title subtle">原地转头</div><div class="move-grid"><button data-turn="left">向左看</button><button data-turn="up">抬头</button><button data-turn="right">向右看</button><button data-turn="down">低头</button><button id="level">水平视线</button></div><label class="field">生图备注<textarea id="notes" rows="3" maxlength="1000" placeholder="例如：保持日景；重点看床头；不要人物"></textarea></label><div class="capture-actions"><button id="save" class="secondary" disabled>保存机位与预览</button><button id="request" class="primary" disabled>选此机位生图 <span>↗</span></button></div><p class="handoff-note">点击后保存待生图记录。回到对话说「按已选机位生图」，我会读取本地记录接着制作。</p><div id="handoff" hidden><strong>机位已准备好</strong><p id="handoff-text"></p><button id="copy">复制给助手的话</button></div><details><summary>镜头信息</summary><pre id="camera-info"></pre></details><footer>只展示当前版本<br>固定家具 · 固定门窗 · 固定品牌位置</footer></aside></main><script type="module" src="app.js"></script></body></html>
