<text x="312.00" y="808.40" font-size="16" text-anchor="middle" font-weight="400">一楼下平台</text>
<text x="1060.00" y="430.00" font-size="23" text-anchor="middle" font-weight="700">二楼走廊投影</text>
<text x="1060.00" y="507.00" font-size="20" text-anchor="middle" font-weight="400">一楼用途与外接通路尚未定位</text>
<text x="1753.00" y="738.00" font-size="23" text-anchor="middle" font-weight="700">A上方</text>
<text x="1038.00" y="672.00" font-size="21" text-anchor="middle" font-weight="400">单一直跑梯段：由左向右上楼</text>
<text x="312.00" y="936.00" font-size="17" text-anchor="middle" font-weight="400" style="fill:#9b6842">C二楼地面在上方附近</text>
<rect x="110" y="1026" width="960" height="34" fill="#e3ebe6" rx="4"/>
<text x="124.00" y="1050.00" font-size="20" text-anchor="start" font-weight="700">落脚后再接一楼</text>
<text x="124.00" y="1085.00" font-size="16" text-anchor="start" font-weight="400">参考图可看见B及侧向空间，但不能证明它在旧玄关的哪一个坐标。</text>
<text x="124.00" y="1114.00" font-size="16" text-anchor="start" font-weight="400">绿色虚线只表示需有侧向接续，不新画一扇门，也不宣称已接通客厅。</text>
<rect x="1130" y="1026" width="960" height="34" fill="#e3ebe6" rx="4"/>
<text x="1144.00" y="1050.00" font-size="20" text-anchor="start" font-weight="700">投影与净空必须共同校核</text>
<text x="1144.00" y="1085.00" font-size="16" text-anchor="start" font-weight="400">C下的B、第一批踏步以及梁底要在纵剖中核对净空。</text>
<text x="1144.00" y="1114.00" font-size="16" text-anchor="start" font-weight="400">本图未指定一楼房间及家具，不用搬动客厅去补此前任意位移。</text>
