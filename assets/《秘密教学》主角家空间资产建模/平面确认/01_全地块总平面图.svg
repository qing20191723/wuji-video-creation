<text x="914.00" y="180.00" font-size="20" text-anchor="start" font-weight="700">场地与外观基准</text>
<text x="914.00" y="215.00" font-size="16" text-anchor="start" font-weight="400">地块参考：17.00×33.00m，约561㎡。</text>
<text x="914.00" y="244.00" font-size="16" text-anchor="start" font-weight="400">别墅主体参考外包络：10.40×19.60m。</text>
<text x="914.00" y="273.00" font-size="16" text-anchor="start" font-weight="400">洗衣 / 公卫在西侧局部突出1.80m。</text>
<text x="914.00" y="302.00" font-size="16" text-anchor="start" font-weight="400">地块与外轮廓为本次补充设计，不是实测。</text>
<rect x="900" y="332" width="790" height="34" fill="#e3ebe6" rx="4"/>
<text x="914.00" y="356.00" font-size="20" text-anchor="start" font-weight="700">车库与人员入口</text>
<text x="914.00" y="391.00" font-size="16" text-anchor="start" font-weight="400">沿用V3正立面：临街车库＋右侧独立人行门。</text>
<text x="914.00" y="420.00" font-size="16" text-anchor="start" font-weight="400">车库按一辆车校准，净6.60×6.20m。</text>
<text x="914.00" y="449.00" font-size="16" text-anchor="start" font-weight="400">车辆按1.90×4.80m；两侧开门带各0.80m。</text>
<text x="914.00" y="478.00" font-size="16" text-anchor="start" font-weight="400">直进直出；不声称库内可以完成180°掉头。</text>
<text x="914.00" y="507.00" font-size="16" text-anchor="start" font-weight="400">车库后侧与住宅之间留3.20m前庭。</text>
<text x="914.00" y="536.00" font-size="16" text-anchor="start" font-weight="400">人行通道净1.50m，与车行路线分开。</text>
<rect x="900" y="566" width="790" height="34" fill="#e3ebe6" rx="4"/>
<text x="914.00" y="590.00" font-size="20" text-anchor="start" font-weight="700">围墙 / 庭院 / 外窗</text>
<text x="914.00" y="625.00" font-size="16" text-anchor="start" font-weight="400">围墙闭合，只有车行门、人行门两处入口。</text>
<text x="914.00" y="654.00" font-size="16" text-anchor="start" font-weight="400">东侧通路2.60m；西侧突出部最窄2.20m。</text>
<text x="914.00" y="683.00" font-size="16" text-anchor="start" font-weight="400">住宅后墙至围墙3.40m。</text>
<text x="914.00" y="712.00" font-size="16" text-anchor="start" font-weight="400">蓝色虚线是二楼阳台 / 后露台投影。</text>
<text x="914.00" y="741.00" font-size="16" text-anchor="start" font-weight="400">大窗外侧有室外空间，不对着新增室内房间。</text>
<rect x="900" y="771" width="790" height="34" fill="#e3ebe6" rx="4"/>
<text x="914.00" y="795.00" font-size="20" text-anchor="start" font-weight="700">外景变化必须确认</text>
<text x="914.00" y="830.00" font-size="16" text-anchor="start" font-weight="400">保留浅外墙、黑窗框、平屋顶和临街车库语言。</text>
<text x="914.00" y="859.00" font-size="16" text-anchor="start" font-weight="400">主体纵深、窗位和阳台分段随室内布局调整。</text>
<text x="914.00" y="888.00" font-size="16" text-anchor="start" font-weight="400">不承诺新平面能与全部旧外景逐像素对应。</text>
<text x="914.00" y="917.00" font-size="16" text-anchor="start" font-weight="400">本次不生成外景图，也不更新三维模型。</text>
</svg>