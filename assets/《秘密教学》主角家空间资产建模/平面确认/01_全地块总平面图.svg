<text x="1334.00" y="312.00" font-size="16" text-anchor="start" font-weight="400">正面右侧巷道；背面看时在左。</text>
<rect x="1320" y="342" width="410" height="34" fill="#e3ebe6" rx="4"/>
<text x="1334.00" y="366.00" font-size="20" text-anchor="start" font-weight="700">尺寸如何确定</text>
<text x="1334.00" y="401.00" font-size="16" text-anchor="start" font-weight="400">主体22×10.4m暂保留室内所需。</text>
<text x="1334.00" y="430.00" font-size="16" text-anchor="start" font-weight="400">地块由30×25收至26×21.4m。</text>
<text x="1334.00" y="459.00" font-size="16" text-anchor="start" font-weight="400">围墙至主体8m，车库后净2.2m。</text>
<text x="1334.00" y="488.00" font-size="16" text-anchor="start" font-weight="400">侧院1.8/2.2m，后院3.0m。</text>
<rect x="1320" y="518" width="410" height="34" fill="#e3ebe6" rx="4"/>
<text x="1334.00" y="542.00" font-size="20" text-anchor="start" font-weight="700">尚未证明的部分</text>
<text x="1334.00" y="577.00" font-size="16" text-anchor="start" font-weight="400">车辆4.8×1.9m；转弯半径拟4.2m。</text>
<text x="1334.00" y="606.00" font-size="16" text-anchor="start" font-weight="400">轨迹仅低速车身包络，不是车型认证。</text>
<text x="1334.00" y="635.00" font-size="16" text-anchor="start" font-weight="400">上层南侧是公共区，窗位与原图有差异。</text>
<text x="1334.00" y="664.00" font-size="16" text-anchor="start" font-weight="400">右侧木饰面小体量用途待定，未补造房间。</text>
<text x="70.00" y="1160.00" font-size="17" text-anchor="start" font-weight="400">蓝线＝上层阳台露台投影；橙线＝倒车示意。围墙、车库、人行门与建筑使用同一坐标。</text>
</svg>