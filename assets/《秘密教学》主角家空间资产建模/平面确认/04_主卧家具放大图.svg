<text x="954.00" y="263.00" font-size="16" text-anchor="start" font-weight="400">外窗与衣柜/梳妆台/衣架分处床的两侧。</text>
<text x="954.00" y="292.00" font-size="16" text-anchor="start" font-weight="400">落位后床头西、窗北、主卫东；入口正对直廊。</text>
