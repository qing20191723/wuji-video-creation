<text x="1016.00" y="449.00" font-size="19" text-anchor="middle" font-weight="400" style="fill:#4188a0">洞口上方不能再铺整块二楼楼板</text>
<text x="1148.00" y="944.00" font-size="19" text-anchor="middle" font-weight="400">踏步数量、坡度、平台尺寸仅示意</text>
<rect x="110" y="1136" width="960" height="34" fill="#e3ebe6" rx="4"/>
<text x="124.00" y="1160.00" font-size="20" text-anchor="start" font-weight="700">参考①②⑥共同可见</text>
<text x="124.00" y="1195.00" font-size="16" text-anchor="start" font-weight="400">舒亚端的二楼地面／收头跨在下方空间上方；下楼尽头另见一楼地面。</text>
<text x="124.00" y="1224.00" font-size="16" text-anchor="start" font-weight="400">本稿把它们拆为C与B，精确投影范围仍待尺度校准。</text>
<rect x="1130" y="1136" width="960" height="34" fill="#e3ebe6" rx="4"/>
<text x="1144.00" y="1160.00" font-size="20" text-anchor="start" font-weight="700">本轮分析的边界</text>
<text x="1144.00" y="1195.00" font-size="16" text-anchor="start" font-weight="400">共识：平行的走廊与直梯、两端接续、上下平台、侧窗类型。</text>
<text x="1144.00" y="1224.00" font-size="16" text-anchor="start" font-weight="400">差异：舒亚端木门或玻璃门、玻璃后额外台阶；不混入统一几何。</text>
