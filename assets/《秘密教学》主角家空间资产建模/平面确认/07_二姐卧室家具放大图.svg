<text x="954.00" y="205.00" font-size="16" text-anchor="start" font-weight="400">房内关系顺时针转90°；外轮廓暂保持6.20×5.80m。</text>
<text x="954.00" y="234.00" font-size="16" text-anchor="start" font-weight="400">床头、抽屉柜、电脑桌、入口均在南墙。</text>
<text x="954.00" y="263.00" font-size="16" text-anchor="start" font-weight="400">从北向南看：左床、中桌、右门；衣物架在右侧西墙。</text>
<text x="954.00" y="292.00" font-size="16" text-anchor="start" font-weight="400">入口直接接直走廊，无凹位；北窗沿用辅助视角关系。</text>
<text x="954.00" y="321.00" font-size="16" text-anchor="start" font-weight="400">无第二卧室门；公共露台改从二姐端西侧尽头进入。</text>
