<aside><div class="eyebrow">SPATIAL REVIEW / V4</div><h1>秘密教学<br>全屋空间检查</h1><p>先确认同一个家，再恢复场景图片。<br>中性模型 · 影视设计参考尺寸 · 待验收</p>
<h2>① 看全屋与楼梯</h2><div class="buttons" id="modes"><button data-mode="floor1">一楼剖切</button><button data-mode="floor2">二楼剖切</button><button data-mode="stairs">楼梯剖切</button><button data-mode="exterior">建筑外壳</button></div>
<label><input id="labels" type="checkbox" checked> 显示房间名称</label><label><input id="path" type="checkbox" checked> 显示同一条往返路线</label><label><input id="brand" type="checkbox" checked> 显示 Logo 载体占位</label>
<h2>② 核对已确认参考</h2><div class="wide" id="cams"></div><select id="spaceCam" style="width:100%;padding:9px;border:1px solid #bccbd0;border-radius:6px;color:#28434b"><option value="">其他房间与外部机位…</option></select><label><input id="compare" type="checkbox"> 并排显示原参考图</label>
<h2>③ 连续走一遍</h2><div class="buttons"><button id="forward">房门 → 餐厨</button><button id="reverse">餐厨 → 房门</button><button id="pause">暂停 / 继续</button></div><input id="scrub" type="range" min="0" max="1000" value="0"><div id="walkstatus" class="status">A：二楼上平台　B：一楼落地<br>直跑下降 A → B；走廊与梯段并排。</div>
<h2>④ 选中物件</h2><p id="inspector">单击墙体、门窗或家具，查看固定编号。拖动旋转，右键平移，滚轮缩放。</p>
